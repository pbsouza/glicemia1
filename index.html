<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Glicemia</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      padding: 16px;
      color: #111827;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .btn-salvar.editando {
      background: #f59e0b;
    }

    .registro {
      border-bottom: 2px solid #babcbf;
      padding: 18px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .registro:nth-child(even) { background:#f9fafb; }
    .registro:nth-child(odd) { background:#fff; }

    .data-registro {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .grid-medicoes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .medicao-box {
      background: rgba(0,0,0,0.02);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #e5e7eb;
    }

    .medicao-valor {
      font-size: 22px;
      font-weight: bold;
    }

    .alta { color:#dc2626; }
    .baixa { color:#ea580c; }
    .normal { color:#16a34a; }

    .btn-editar {
      width:auto;
      padding:10px;
      background:#f59e0b;
      border-radius:10px;
      font-size:13px;
    }

    .vazio {
      text-align:center;
      padding:20px;
      color:#6b7280;
    }

    canvas { max-height:380px; }

    #loading {
      position:fixed;
      inset:0;
      display:none;
      background:rgba(255,255,255,0.8);
      justify-content:center;
      align-items:center;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>Controle de Glicemia</h1>

    <div class="form-group">
      <label>Data</label>
      <input type="date" id="data">
    </div>

    <div class="form-group"><label>Jejum</label><input id="jejum"></div>
    <div class="form-group"><label>Almoço Antes</label><input id="almocoAntes"></div>
    <div class="form-group"><label>Almoço Depois</label><input id="almocoDepois"></div>
    <div class="form-group"><label>Jantar Antes</label><input id="jantarAntes"></div>
    <div class="form-group"><label>Deitar</label><input id="deitar"></div>

    <button id="btnSalvar" onclick="salvarRegistro()">Salvar Medição</button>
  </div>

  <div class="card">
    <button onclick="gerarPDF()">Gerar PDF</button>
  </div>

  <div class="card">
    <canvas id="grafico"></canvas>
  </div>

  <div class="card">
    <div id="lista"></div>
  </div>

</div>

<div id="loading">Carregando...</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxsncjeSmIgwvvZrcik9GyELD1KmonKEuMQEIxvRFhm4kE9eS4n83U5LZbJJ5PoNt59/exec";

let db;
let editId = null;
let grafico = null;

/* ---------------- DB ---------------- */
function abrirDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("glicemiaDB", 1);

    req.onupgradeneeded = e => {
      db = e.target.result;
      const store = db.createObjectStore("registros", {
        keyPath: "id",
        autoIncrement: true
      });
    };

    req.onsuccess = e => {
      db = e.target.result;
      resolve(db);
    };

    req.onerror = reject;
  });
}

function salvarLocal(data) {
  return new Promise(resolve => {
    const tx = db.transaction("registros", "readwrite");
    tx.objectStore("registros").add({
      ...data,
      sync: false,
      createdAt: new Date().toISOString()
    });
    tx.oncomplete = resolve;
  });
}

function atualizarLocal(id, data) {
  return new Promise(resolve => {
    const tx = db.transaction("registros", "readwrite");
    tx.objectStore("registros").put({ id, ...data, sync:false });
    tx.oncomplete = resolve;
  });
}

function getAll() {
  return new Promise(resolve => {
    const tx = db.transaction("registros", "readonly");
    const req = tx.objectStore("registros").getAll();
    req.onsuccess = () => resolve(req.result);
  });
}

/* ---------------- SYNC ---------------- */
function online() {
  return navigator.onLine;
}

async function enviarServidor(r) {
  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(r)
  });
}

async function sincronizar() {
  if (!online()) return;

  const dados = await getAll();

  for (let r of dados) {
    if (!r.sync) {
      try {
        await enviarServidor(r);

        const tx = db.transaction("registros","readwrite");
        tx.objectStore("registros").put({ ...r, sync:true });

      } catch(e) {
        console.log("sync erro", e);
      }
    }
  }

  carregar();
}

/* ---------------- UI ---------------- */
function getForm() {
  return {
    data: data.value,
    jejum,
    almocoAntes,
    almocoDepois,
    jantarAntes,
    deitar
  };
}

async function salvarRegistro() {
  const data = {
    data: document.getElementById('data').value,
    jejum: jejum.value,
    almocoAntes: almocoAntes.value,
    almocoDepois: almocoDepois.value,
    jantarAntes: jantarAntes.value,
    deitar: deitar.value
  };

  if (editId) {
    await atualizarLocal(editId, data);
    editId = null;
    btnSalvar.innerText = "Salvar Medição";
  } else {
    await salvarLocal(data);
  }

  limpar();
  await carregar();
  sincronizar();
}

function limpar(){
  jejum.value = "";
  almocoAntes.value = "";
  almocoDepois.value = "";
  jantarAntes.value = "";
  deitar.value = "";
}

async function carregar() {
  const lista = await getAll();
  render(lista);
}

function render(dados) {
  const el = document.getElementById("lista");
  el.innerHTML = "";

  dados.sort((a,b)=>new Date(b.data)-new Date(a.data));

  let labels=[], j=[], aa=[], ad=[], ja=[], d=[];

  dados.forEach(r=>{
    labels.push(r.data);
    j.push(r.jejum);
    aa.push(r.almocoAntes);
    ad.push(r.almocoDepois);
    ja.push(r.jantarAntes);
    d.push(r.deitar);

    el.innerHTML += `
      <div class="registro">
        <div class="data-registro">${r.data}</div>
        <button class="btn-editar" onclick='editar(${JSON.stringify(r)})'>Editar</button>
      </div>
    `;
  });

  grafico?.destroy();

  grafico = new Chart(document.getElementById("grafico"), {
    type:"line",
    data:{
      labels,
      datasets:[
        {label:"Jejum", data:j},
        {label:"Antes Almoço", data:aa},
        {label:"Depois Almoço", data:ad},
        {label:"Jantar", data:ja},
        {label:"Deitar", data:d}
      ]
    }
  });
}

function editar(r){
  document.getElementById("data").value = r.data;
  jejum.value = r.jejum;
  almocoAntes.value = r.almocoAntes;
  almocoDepois.value = r.almocoDepois;
  jantarAntes.value = r.jantarAntes;
  deitar.value = r.deitar;

  editId = r.id;
  btnSalvar.innerText = "Atualizar";
}

/* ---------------- INIT ---------------- */
async function init(){
  await abrirDB();
  await carregar();
  sincronizar();
}

window.addEventListener("online", sincronizar);

init();
</script>

</body>
</html>
